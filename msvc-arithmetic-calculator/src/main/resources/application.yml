server:
  port: ${PORT:8001}
spring:
  application:
    name: msvc-arithmetic-calculator
  h2:
    console:
      enabled: true
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    defer-datasource-initialization: true
    properties:
      hibernate.format_sql: true
    hibernate:
      ddl-auto: create-drop
request-random-dto:
  jsonrpc: 2.0
  method: generateStrings
  params:
    apiKey: ab422961-ddc9-4ad5-80b1-5ad26c8cead4
    n: 8
    length: 10
    characters: abcdefghijklmnopqrstuvwxyz
    replacement: true
  id: 42
msvc:
  users:
    url: ${USERS_URL:localhost:8080}
eureka:
  client:
    service-url:
      defaultZone : http://localhost:8761/eureka/