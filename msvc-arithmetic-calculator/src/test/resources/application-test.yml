server:
  port: ${PORT:8001}
spring:
  application:
    name: msvc-arithmetic-calculator
  h2:
    console:
      enabled: true
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    defer-datasource-initialization: true
    properties:
      hibernate.format_sql: true
    hibernate:
      ddl-auto: create-drop