version: "3.9"
services:
  msvc-users:
    container_name: msvc-users
    platform: linux/amd64
    image: chris0100eka/users:latest
    ports:
      - "8002:8002"
    env_file: ./msvc-users/.env
    networks:
      - calculator
    restart: always
    depends_on:
      - msvc-gateway
      - msvc-registry

  msvc-arithmetic-calculator:
    container_name: msvc-arithmetic-calculator
    platform: linux/amd64
    image: chris0100eka/arithmetic-calculator:latest
    ports:
      - "8001:8001"
    env_file:
      - ./msvc-arithmetic-calculator/.env
    networks:
      - calculator
    restart: always
    depends_on:
      - msvc-gateway
      - msvc-registry

  msvc-gateway:
    container_name: msvc-gateway
    platform: linux/amd64
    image: chris0100eka/gateway:latest
    ports:
      - "8080:8080"
    networks:
      - calculator
    restart: always
    depends_on:
      - msvc-registry

  msvc-registry:
    container_name: msvc-registry
    platform: linux/amd64
    image: chris0100eka/registry:latest
    ports:
      - "8761:8761"
    environment:
      server.port: 8761
      eureka.client.enabled: 'true'
      eureka.host: eureka-server
      eureka.instance.preferIpAddress: 'true'
    networks:
      - calculator
    restart: always

networks:
  calculator:
    name: calculator
    external: true