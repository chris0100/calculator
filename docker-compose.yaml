version: "3.9"
services:
  msvc-users:
    container_name: msvc-users
    platform: linux/amd64
    image: chris0100eka/users:latest
    ports:
      - "8002:8002"
    env_file: ./msvc-users/.env
    networks:
      - calculator
    restart: always

  msvc-arithmetic-calculator:
    container_name: msvc-arithmetic-calculator
    platform: linux/amd64
    image: chris0100eka/arithmetic-calculator:latest
    ports:
      - "8001:8001"
    env_file:
      - ./msvc-arithmetic-calculator/.env
    networks:
      - calculator
    restart: always

networks:
  calculator:
    name: calculator
    external: true